[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
# Minimo soportado. Ruff avisa si se cuela sintaxis posterior.
target-version = "py311"
line-length = 110
exclude = [".venv", "venv", "work", "logs", "tests/fakebin"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "C4"]
ignore = [
  "E501",    # el limite de linea lo controla line-length, sin fallar por comentarios largos
  "S603",    # subprocess con lista de argumentos: es exactamente lo que se quiere aqui
  "S404",    # importar subprocess es inevitable en un firmador
  # Modernizacion de tipado pendiente para una limpieza aparte: typing.Dict/List
  # -> dict/list (UP006/UP035), Optional[X] -> X | None (UP007) y timezone.utc ->
  # datetime.UTC (UP017). Son ~70 cambios cosmeticos que no pintan nada en una
  # rama de seguridad, y aplicarlos ata el codigo a 3.10+/3.11+ en tiempo de
  # ejecucion, no solo en las anotaciones.
  # UP045 aparece con ruff 0.16: la regla UP007 se partio en dos y el caso
  # Optional[X] -> X | None se movio al codigo nuevo.
  "UP006", "UP035", "UP007", "UP017", "UP045",
  # try/except/pass y /continue son deliberados en las rutas best-effort: la
  # traza y el mantenimiento no pueden tumbar una firma en curso.
  "S110", "S112",
]

[tool.ruff.lint.per-file-ignores]
# assert y credenciales de mentira son normales en tests; B905 entra con la
# misma modernizacion pendiente de arriba.
"tests/*" = ["S101", "S105", "S106", "B905"]
