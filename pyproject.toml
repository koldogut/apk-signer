[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
# 3.9 es el minimo declarado en el README; ruff avisa si se cuela sintaxis
# posterior (por ejemplo `int | None` en anotaciones).
target-version = "py39"
line-length = 110
exclude = [".venv", "venv", "work", "logs", "tests/fakebin"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "C4"]
ignore = [
  "E501",    # el limite de linea lo controla line-length, sin fallar por comentarios largos
  "S603",    # subprocess con lista de argumentos: es exactamente lo que se quiere aqui
  "S404",    # importar subprocess es inevitable en un firmador
  "UP038",   # isinstance con tuplas sigue siendo mas legible
  # typing.Dict/List siguen siendo validos y migrarlos a dict/list serian ~40
  # cambios cosmeticos en una rama de seguridad. Pendiente para una limpieza aparte.
  "UP006", "UP035",
  # try/except/pass y /continue son deliberados en las rutas best-effort: la
  # traza y el mantenimiento no pueden tumbar una firma en curso.
  "S110", "S112",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # assert y credenciales de mentira son normales en tests
