# APK Signer - portal web
#
# Certificado: /etc/ssl/apk-signer/apk-signer.crt
# Clave:       /etc/ssl/apk-signer/apk-signer.key
#
# setup.sh genera un certificado autofirmado si no existe. Para usar un
# certificado corporativo, sustituye esos dos ficheros y recarga nginx:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Todo el trafico plano se redirige a HTTPS: el token de usuario y el
    # codigo MFA nunca deben viajar en claro.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # HTTP/2 se deja fuera a proposito: la directiva cambio de sintaxis en
    # nginx 1.25.1 ("http2 on;") y las versiones de Debian 11/12 y Ubuntu
    # 20.04/22.04 (1.18-1.22) solo aceptan "listen 443 ssl http2;". Activalo
    # segun la version que tengas si lo necesitas; no es requisito del portal.

    ssl_certificate     /etc/ssl/apk-signer/apk-signer.crt;
    ssl_certificate_key /etc/ssl/apk-signer/apk-signer.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:apk_signer_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Subidas y firma pueden tardar: evita 504 en APK grandes.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }
}
